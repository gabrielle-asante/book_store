<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceReads All Books</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>📚 AceReads</h1>
            <nav>
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/films">Films</a>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <form method="POST" action ='/books'>
                <label for="title">Title</label>
                <input type="text" name="title" id="title" placeholder="Title"><br>
                <label for="author">Author</label>
                <input type="text" name="author" id="author" placeholder="Author"><br>
                <input type="submit" value="Submit">
            </form>
        </section>
        <section class="all-books-container">
        <h1>All Books:</h1>
        <p>Explore our collection of amazing stories</p>
    <ul class="all-books-list">
        {%for book in books %}
        <li>{{book.title}} by {{book.author}}</li>
        {% endfor %}
    </ul>
    </section>
    </main>
    <footer>
        <p>📚 AceReads</p>
        <p>&copy; AceReads Book Store</p>
    </footer>
    </div>
</body>
</html>
